# AirSense — Mosquitto broker configuration.
#
# A minimal, open broker for a local laptop. This is fine for a lab /
# demo; it is NOT secure for a networked or public deployment (no TLS,
# no auth). For a classroom demo on the same machine this is intended.
#
# Run with:
#   mosquitto -c broker/mosquitto.conf
#
# (On Windows: mosquitto.exe -c broker/mosquitto.conf, or install it as
# a service. See README.md.)

listener 1883 0.0.0.0
persistence true
persistence_location ./mosquitto_data/
log_dest file ./mosquitto.log
log_level notice

# To turn on basic auth, UNCOMMENT the block below and create a password
# file:   mosquitto_passwd -c users.pass airsense
#
# auth
# password_file ./users.pass
# allow_anonymous false
